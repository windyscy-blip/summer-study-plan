<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长查看 · 暑假学习打卡</title>
<style>
:root { --ink:#302b42; --muted:#7d7691; --line:#e7e1ee; --violet:#6c63ff; --violet-soft:#f0efff; --green:#2e8a57; --green-soft:#eaf8ef; --amber:#b76d14; --amber-soft:#fff5e6; --bg:#fbf9fd; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.page { width:min(960px, calc(100% - 28px)); margin:0 auto; padding:28px 0 50px; }
.header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; }
h1 { font-size:25px; margin:0 0 7px; letter-spacing:.2px; } .subtitle { color:var(--muted); font-size:13px; line-height:1.6; }
.card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px; }
.login-card { max-width:480px; margin:54px auto; } h2 { font-size:17px; margin:0 0 8px; } p { color:var(--muted); font-size:13px; line-height:1.6; }
.form { display:grid; gap:10px; margin-top:16px; } input { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; color:var(--ink); } button { border:0; border-radius:10px; padding:10px 13px; font:inherit; cursor:pointer; } .primary { background:var(--violet); color:#fff; } .secondary { background:var(--violet-soft); color:#5149c9; } .plain { color:var(--muted); background:transparent; padding:7px 0; }
.error { color:#b42318; font-size:12px; min-height:18px; }
#dashboard { display:none; } .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-end; } .sync-note { font-size:12px; color:var(--muted); }
  .code-manager { margin-bottom:16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }.code-manager h2 { margin:0 0 5px; }.code-manager p { margin:0; }.code-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }.code-input { width:128px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font:inherit; letter-spacing:1px; }.code-status { font-size:12px; color:var(--muted); }
  .metrics { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:16px; } .metric .label { color:var(--muted); font-size:12px; } .metric .value { font-size:27px; font-weight:650; margin-top:8px; } .metric .hint { color:var(--muted); font-size:12px; margin-top:4px; }
.layout { display:grid; grid-template-columns:1.06fr .94fr; gap:16px; } .section-title { font-size:16px; font-weight:650; margin:0 0 14px; } .week-list { display:grid; gap:9px; }.day-row { border:1px solid var(--line); border-radius:12px; padding:11px 12px; display:flex; align-items:center; gap:12px; cursor:pointer; }.day-row:hover,.day-row.active { border-color:#b9b4ff; background:#faf9ff; }.date { min-width:74px; font-size:13px; font-weight:600; }.bar { height:7px; flex:1; border-radius:99px; background:#eeeaf4; overflow:hidden; }.bar i { display:block; height:100%; border-radius:inherit; background:var(--violet); }.pct { color:var(--muted); font-size:12px; min-width:68px; text-align:right; }.full { color:var(--green); font-size:12px; }
.detail-title { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:12px; }.detail-title h2 { margin:0; }.task { display:flex; gap:10px; padding:11px 0; border-bottom:1px solid #f0edf4; }.task:last-child { border-bottom:0; }.check { width:20px; height:20px; margin-top:1px; border:2px solid #c9c2d4; border-radius:50%; flex:none; }.task.done .check { background:var(--green); border-color:var(--green); position:relative; }.task.done .check:after { content:'✓'; color:#fff; position:absolute; left:3px; top:-2px; font-size:14px; }.task-name { font-size:13px; }.task-detail { color:var(--muted); font-size:12px; margin-top:3px; line-height:1.5; }.tag { display:inline-block; padding:2px 6px; background:var(--violet-soft); color:#554ed0; border-radius:5px; font-size:11px; margin-left:6px; }.empty { text-align:center; padding:34px 14px; color:var(--muted); font-size:13px; }.badge { color:var(--amber); background:var(--amber-soft); border-radius:99px; padding:4px 8px; font-size:11px; white-space:nowrap; }
@media(max-width:700px) { .page { width:min(100% - 20px, 960px); padding-top:20px; }.header { display:block; }.toolbar { justify-content:flex-start; margin-top:12px; }.metrics,.layout { grid-template-columns:1fr; }.metric .value { font-size:24px; }.date { min-width:66px; } }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div><h1>家长查看</h1><div class="subtitle">查看小朋友的云端同步记录。此页只读，不会修改任何打卡内容。</div></div>
    <div class="toolbar" id="headerActions" hidden><span class="sync-note" id="syncNote">正在读取…</span><button class="secondary" type="button" onclick="loadDashboard()">刷新</button><button class="plain" type="button" onclick="signOut()">退出</button></div>
  </header>

  <section class="card login-card" id="loginCard">
    <h2>登录家庭云端</h2><p>使用与小朋友打卡页相同的家庭账号。首次登录后，本设备会保留登录状态。</p>
    <div class="form"><input id="email" type="email" autocomplete="email" placeholder="家庭账号邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="家庭账号密码"><button class="primary" type="button" onclick="signIn()">登录并查看</button><div class="error" id="loginError"></div></div>
  </section>

  <section id="dashboard">
    <section class="card code-manager">
      <div><h2>设备兑换码</h2><p>设置 6 位数字兑换码。小朋友输入后会获得惊喜奖励，并自动把打卡记录同步到这里。</p></div>
      <div class="code-actions"><input class="code-input" id="redeemCodeSetting" inputmode="numeric" maxlength="6" placeholder="6 位数字"><button class="primary" type="button" onclick="saveRedeemCode()">保存兑换码</button></div>
      <div class="code-status" id="codeStatus">正在读取兑换码状态…</div>
    </section>
    <section class="metrics"><div class="card metric"><div class="label">最近 7 天完成率</div><div class="value" id="weekRate">—</div><div class="hint" id="weekHint">等待同步记录</div></div><div class="card metric"><div class="label">最近一次同步</div><div class="value" id="lastSync">—</div><div class="hint" id="lastSyncHint">—</div></div><div class="card metric"><div class="label">今天进度</div><div class="value" id="todayRate">—</div><div class="hint" id="todayHint">今天尚无同步</div></div></section>
    <section class="layout"><section class="card"><h2 class="section-title">最近 7 天</h2><div class="week-list" id="weekList"></div></section><section class="card"><div class="detail-title"><h2 id="detailHeading">打卡明细</h2><span class="badge" id="detailBadge">请选择日期</span></div><div id="taskDetail" class="empty">从左侧选择一个有同步记录的日期，即可查看任务完成情况。</div></section></section>
  </section>
</main>
<script src="cloud-config.js?v=1.1.0"></script>
<script src="cloud-sync.js?v=1.1.0"></script>
<script>
let rows = [];
let activeDate = '';
function dayKey(date) { return date.toISOString().slice(0, 10); }
function formatDate(key) { const d = new Date(`${key}T00:00:00`); return `${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`; }
function formatTime(value) { if (!value) return '—'; const d = new Date(value); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function rowFor(key) { return rows.find((row) => row.check_date === key); }
function valuesOf(row) { return row && row.checks && row.checks.values ? row.checks.values : (row && row.checks ? row.checks : {}); }
function tasksOf(row) { return row && row.checks && Array.isArray(row.checks.tasks) ? row.checks.tasks : []; }
function setLogin(show) { document.getElementById('loginCard').style.display = show ? '' : 'none'; document.getElementById('dashboard').style.display = show ? 'none' : 'block'; document.getElementById('headerActions').hidden = show; }
async function signIn() { const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value; const error = document.getElementById('loginError'); error.textContent = ''; if (!email || !password) { error.textContent = '请填写家庭账号邮箱和密码。'; return; } try { await SummerCloud.signIn(email, password); await loadDashboard(); } catch (e) { error.textContent = e.message || '登录失败，请检查账号、密码和网络。'; } }
async function signOut() { try { await SummerCloud.signOut(); } finally { rows = []; activeDate = ''; setLogin(true); } }
async function loadCodeStatus() { const note = document.getElementById('codeStatus'); try { const status = await SummerCloud.getRedeemCodeStatus(); note.textContent = status.configured ? `兑换码已设置 · 最近更新：${formatTime(status.updatedAt)}` : '尚未设置兑换码'; } catch (e) { note.textContent = '兑换码状态读取失败'; } }
async function saveRedeemCode() { const input = document.getElementById('redeemCodeSetting'); const code = input.value.trim(); const note = document.getElementById('codeStatus'); if (!/^\d{6}$/.test(code)) { note.textContent = '请输入 6 位数字兑换码。'; return; } note.textContent = '正在保存兑换码…'; try { await SummerCloud.setRedeemCode(code); input.value = ''; note.textContent = '兑换码已保存，可让小朋友输入领取惊喜奖励。'; } catch (e) { note.textContent = e.message || '保存失败，请重试。'; } }
async function loadDashboard() { const note = document.getElementById('syncNote'); note.textContent = '正在读取云端记录…'; try { rows = await SummerCloud.fetchCheckins(7); setLogin(false); renderDashboard(); loadCodeStatus(); note.textContent = `已读取 ${rows.length} 天记录 · ${formatTime(new Date().toISOString())}`; } catch (e) { note.textContent = '读取失败，请检查网络或账号权限'; } }
function renderDashboard() { const today = dayKey(new Date()); const totalDone = rows.reduce((sum, row) => sum + Number(row.done_count || 0), 0); const totalTasks = rows.reduce((sum, row) => sum + Number(row.total_count || 0), 0); document.getElementById('weekRate').textContent = totalTasks ? `${Math.round(totalDone / totalTasks * 100)}%` : '—'; document.getElementById('weekHint').textContent = rows.length ? `${totalDone} / ${totalTasks} 项已完成` : '最近 7 天暂无同步记录'; const latest = rows.slice().sort((a,b) => new Date(b.last_synced_at) - new Date(a.last_synced_at))[0]; document.getElementById('lastSync').textContent = latest ? formatTime(latest.last_synced_at) : '—'; document.getElementById('lastSyncHint').textContent = latest ? `${formatDate(latest.check_date)}的打卡记录` : '等待小朋友端同步'; const todayRow = rowFor(today); document.getElementById('todayRate').textContent = todayRow ? `${todayRow.done_count}/${todayRow.total_count}` : '—'; document.getElementById('todayHint').textContent = todayRow ? (todayRow.is_full ? '今天已全部完成' : '今天仍有待完成任务') : '今天尚无同步'; const list = document.getElementById('weekList'); const dayRows = []; for (let i=0; i<7; i++) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const key = dayKey(d); const row = rowFor(key); const pct = row && row.total_count ? Math.round(row.done_count / row.total_count * 100) : 0; dayRows.push(`<div class="day-row ${key === activeDate ? 'active' : ''}" onclick="selectDay('${key}')"><div class="date">${formatDate(key)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="pct">${row ? `${row.done_count}/${row.total_count}` : '未同步'}</div>${row && row.is_full ? '<span class="full">完成</span>' : ''}</div>`); } list.innerHTML = dayRows.join(''); if (!activeDate && rows.length) selectDay(rows[0].check_date); else if (activeDate) renderDetail(activeDate); }
function selectDay(key) { activeDate = key; renderDashboard(); }
function renderDetail(key) { const row = rowFor(key); document.getElementById('detailHeading').textContent = formatDate(key); const badge = document.getElementById('detailBadge'); const box = document.getElementById('taskDetail'); if (!row) { badge.textContent = '未同步'; box.className = 'empty'; box.textContent = '这一天尚未从小朋友设备同步打卡记录。'; return; } badge.textContent = `${row.done_count}/${row.total_count} · ${row.is_full ? '已完成' : '进行中'}`; const tasks = tasksOf(row); const values = valuesOf(row); if (!tasks.length) { box.className = 'empty'; box.textContent = '这条是旧格式同步记录，未包含任务明细；之后重新同步即可显示。'; return; } box.className = ''; box.innerHTML = tasks.map((task) => `<div class="task ${values[task.id] ? 'done' : ''}"><span class="check"></span><div><div class="task-name">${task.name}<span class="tag">${task.period === 'morning' ? '上午' : task.period === 'afternoon' ? '下午' : '晚上'}</span></div><div class="task-detail">${task.detail || ''}</div></div></div>`).join(''); }
(async function init() { if (!window.SummerCloud || !SummerCloud.isConfigured()) { document.getElementById('loginError').textContent = '云端配置缺失。'; return; } try { const session = await SummerCloud.getSession(); if (session) await loadDashboard(); else setLogin(true); } catch (e) { setLogin(true); } })();
</script>
</body>
</html>
