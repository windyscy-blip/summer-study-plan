<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家长查看 · 暑假学习打卡</title>
<style>
:root { --ink:#302b42; --muted:#7d7691; --line:#e7e1ee; --violet:#6c63ff; --violet-soft:#f0efff; --green:#2e8a57; --green-soft:#eaf8ef; --amber:#b76d14; --amber-soft:#fff5e6; --red:#b42318; --bg:#fbf9fd; } * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; } .page { width:min(960px, calc(100% - 28px)); margin:0 auto; padding:28px 0 50px; } .header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; } h1 { font-size:25px; margin:0 0 7px; letter-spacing:.2px; } .subtitle { color:var(--muted); font-size:13px; line-height:1.6; } .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px; } .login-card { max-width:480px; margin:54px auto; } h2 { font-size:17px; margin:0 0 8px; } p { color:var(--muted); font-size:13px; line-height:1.6; } .form { display:grid; gap:10px; margin-top:16px; } input,select { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; color:var(--ink); background:#fff; } button { border:0; border-radius:10px; padding:10px 13px; font:inherit; cursor:pointer; } button:disabled { opacity:.55; cursor:not-allowed; } .primary { background:var(--violet); color:#fff; } .secondary { background:var(--violet-soft); color:#5149c9; } .danger { background:#fff0f0; color:var(--red); } .plain { color:var(--muted); background:transparent; padding:7px 0; } .error { color:var(--red); font-size:12px; min-height:18px; } #dashboard { display:none; } .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-end; } .sync-note,.hint { font-size:12px; color:var(--muted); }.code-manager,.reward-manager { margin-bottom:16px; }.code-manager { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }.code-manager h2,.reward-manager h2 { margin:0 0 5px; }.code-manager p,.reward-manager p { margin:0; }.code-actions,.reward-form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }.code-input { width:128px; }.code-status,.reward-status { font-size:12px; color:var(--muted); }.reward-form { margin-top:14px; align-items:flex-end; }.field { display:grid; gap:5px; min-width:135px; flex:1; }.field label { font-size:12px; color:var(--muted); }.field.message { flex:2; min-width:180px; }.reward-list { display:grid; gap:9px; margin-top:15px; }.reward-row { border:1px solid var(--line); border-radius:12px; padding:11px 12px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }.reward-main { display:grid; gap:3px; }.reward-title { font-size:13px; font-weight:650; }.reward-meta { color:var(--muted); font-size:12px; }.reward-actions { display:flex; gap:7px; align-items:center; }.state { border-radius:99px; padding:4px 8px; font-size:11px; white-space:nowrap; }.state.pending { background:var(--amber-soft); color:var(--amber); }.state.claimed { background:var(--green-soft); color:var(--green); }.state.off { background:#f3f1f5; color:var(--muted); }.metrics { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:16px; }.metric .label { color:var(--muted); font-size:12px; }.metric .value { font-size:27px; font-weight:650; margin-top:8px; }.metric .hint { color:var(--muted); font-size:12px; margin-top:4px; }.layout { display:grid; grid-template-columns:1.06fr .94fr; gap:16px; }.section-title { font-size:16px; font-weight:650; margin:0 0 14px; }.week-list { display:grid; gap:9px; }.day-row { border:1px solid var(--line); border-radius:12px; padding:11px 12px; display:flex; align-items:center; gap:12px; cursor:pointer; }.day-row:hover,.day-row.active { border-color:#b9b4ff; background:#faf9ff; }.date { min-width:74px; font-size:13px; font-weight:600; }.bar { height:7px; flex:1; border-radius:99px; background:#eeeaf4; overflow:hidden; }.bar i { display:block; height:100%; border-radius:inherit; background:var(--violet); }.pct { color:var(--muted); font-size:12px; min-width:68px; text-align:right; }.full { color:var(--green); font-size:12px; }.detail-title { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:12px; }.detail-title h2 { margin:0; }.task { display:flex; gap:10px; padding:11px 0; border-bottom:1px solid #f0edf4; }.task:last-child { border-bottom:0; }.check { width:20px; height:20px; margin-top:1px; border:2px solid #c9c2d4; border-radius:50%; flex:none; }.task.done .check { background:var(--green); border-color:var(--green); position:relative; }.task.done .check:after { content:'✓'; color:#fff; position:absolute; left:3px; top:-2px; font-size:14px; }.task-name { font-size:13px; }.task-detail { color:var(--muted); font-size:12px; margin-top:3px; line-height:1.5; }.tag { display:inline-block; padding:2px 6px; background:var(--violet-soft); color:#554ed0; border-radius:5px; font-size:11px; margin-left:6px; }.empty { text-align:center; padding:20px 14px; color:var(--muted); font-size:13px; }.badge { color:var(--amber); background:var(--amber-soft); border-radius:99px; padding:4px 8px; font-size:11px; white-space:nowrap; } @media(max-width:700px) { .page { width:min(100% - 20px, 960px); padding-top:20px; }.header { display:block; }.toolbar { justify-content:flex-start; margin-top:12px; }.metrics,.layout { grid-template-columns:1fr; }.metric .value { font-size:24px; }.date { min-width:66px; }.field { min-width:100%; }.reward-form .primary { width:100%; } }
</style>
</head>
<body>
<main class="page">
<header class="header"><div><h1>家长查看</h1><div class="subtitle">查看小朋友的云端同步记录，并发放日常奖励。</div></div><div class="toolbar" id="headerActions" hidden><span class="sync-note" id="syncNote">正在读取…</span><button class="secondary" type="button" onclick="loadDashboard()">刷新</button><button class="plain" type="button" onclick="signOut()">退出</button></div></header>
<section class="card login-card" id="loginCard"><h2>登录家庭云端</h2><p>使用家庭账号查看打卡记录和管理奖励。</p><div class="form"><input id="email" type="email" autocomplete="email" placeholder="家庭账号邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="家庭账号密码"><button class="primary" type="button" onclick="signIn()">登录并查看</button><div class="error" id="loginError"></div></div></section>
<section id="dashboard">
<section class="card code-manager"><div><h2>设备兑换码</h2><p>新设备首次输入后领取初始惊喜，并自动同步打卡记录。</p></div><div class="code-actions"><input class="code-input" id="redeemCodeSetting" inputmode="numeric" maxlength="6" placeholder="6 位数字"><button class="primary" type="button" onclick="saveRedeemCode()">保存兑换码</button></div><div class="code-status" id="codeStatus">正在读取兑换码状态…</div></section>
<section class="card reward-manager"><h2>日常奖励发放</h2><p>生成一次性奖励码。默认当天有效，领取后会自动记入小朋友的卡片库或星星余额。</p><div class="reward-form"><div class="field"><label for="rewardKind">奖励内容</label><select id="rewardKind"><option value="surprise">随机惊喜</option><option value="stars_1">1 颗星星</option><option value="stars_3">3 颗星星</option><option value="stars_5">5 颗星星</option><option value="card_r">随机 R 卡</option><option value="card_sr">随机 SR 卡</option></select></div><div class="field"><label for="rewardDays">有效期</label><select id="rewardDays"><option value="1">当天有效</option><option value="3">3 天有效</option><option value="7">7 天有效</option></select></div><div class="field message"><label for="rewardMessage">鼓励语（可选）</label><input id="rewardMessage" maxlength="50" placeholder="例如：今天阅读很认真，继续加油！"></div><button class="primary" type="button" id="createRewardBtn" onclick="createRewardCode()">生成奖励码</button></div><div class="reward-status" id="rewardStatus"></div><div class="reward-list" id="rewardList"><div class="empty">正在读取最近奖励记录…</div></div></section>
<section class="metrics"><div class="card metric"><div class="label">最近 7 天完成率</div><div class="value" id="weekRate">—</div><div class="hint" id="weekHint">等待同步记录</div></div><div class="card metric"><div class="label">最近一次同步</div><div class="value" id="lastSync">—</div><div class="hint" id="lastSyncHint">—</div></div><div class="card metric"><div class="label">今天进度</div><div class="value" id="todayRate">—</div><div class="hint" id="todayHint">今天尚无同步</div></div></section>
<section class="layout"><section class="card"><h2 class="section-title">最近 7 天</h2><div class="week-list" id="weekList"></div></section><section class="card"><div class="detail-title"><h2 id="detailHeading">打卡明细</h2><span class="badge" id="detailBadge">请选择日期</span></div><div id="taskDetail" class="empty">从左侧选择一个有同步记录的日期，即可查看任务完成情况。</div></section></section>
</section></main>
<script src="cloud-config.js?v=1.5.0"></script><script src="cloud-sync.js?v=1.5.0"></script>
<script>
let rows = []; let activeDate = '';
function dayKey(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
function formatDate(key) { const d = new Date(`${key}T00:00:00`); return `${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`; }
function formatTime(value) { if (!value) return '—'; const d = new Date(value); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function rowFor(key) { return rows.find((row) => row.check_date === key); } function valuesOf(row) { return row?.checks?.values || (row?.checks || {}); } function tasksOf(row) { return Array.isArray(row?.checks?.tasks) ? row.checks.tasks : []; }
function setLogin(show) { document.getElementById('loginCard').style.display = show ? '' : 'none'; document.getElementById('dashboard').style.display = show ? 'none' : 'block'; document.getElementById('headerActions').hidden = show; }
function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;' })[ch]); }
function rewardLabel(reward) { return reward?.type === 'card' ? `${reward.rarity} 卡 · ${reward.cardId}` : `${reward?.stars || 0} 颗星星`; }
function rewardState(item) { if (item.revoked_at) return ['已撤销','off']; if (Number(item.used_count) >= Number(item.max_uses)) return ['已领取','claimed']; if (new Date(item.expires_at).getTime() <= Date.now()) return ['已过期','off']; return ['待领取','pending']; }
async function signIn() { const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value; const error = document.getElementById('loginError'); error.textContent = ''; if (!email || !password) { error.textContent = '请填写家庭账号邮箱和密码。'; return; } try { await SummerCloud.signIn(email, password); await loadDashboard(); } catch (e) { error.textContent = e.message || '登录失败，请检查账号、密码和网络。'; } }
async function signOut() { try { await SummerCloud.signOut(); } finally { rows = []; activeDate = ''; setLogin(true); } }
async function loadCodeStatus() { const note = document.getElementById('codeStatus'); try { const status = await SummerCloud.getRedeemCodeStatus(); note.textContent = status.configured ? `当前设备兑换码：${status.code || '请重新保存一次'} · 最近更新：${formatTime(status.updatedAt)}` : '尚未设置设备兑换码'; } catch (e) { note.textContent = '兑换码状态读取失败'; } }
async function saveRedeemCode() { const input = document.getElementById('redeemCodeSetting'); const code = input.value.trim(); const note = document.getElementById('codeStatus'); if (!/^\d{6}$/.test(code)) { note.textContent = '请输入 6 位数字兑换码。'; return; } note.textContent = '正在保存兑换码…'; try { await SummerCloud.setRedeemCode(code); input.value = ''; await loadCodeStatus(); } catch (e) { note.textContent = e.message || '保存失败，请重试。'; } }
async function loadRewardCodes() { const list = document.getElementById('rewardList'); try { const result = await SummerCloud.listRewardCodes(); const codes = result.codes || []; list.innerHTML = codes.length ? codes.map((item) => { const [label, tone] = rewardState(item); const revoke = tone === 'pending' ? `<button class="danger" type="button" onclick="revokeRewardCode('${item.id}')">撤销</button>` : ''; return `<div class="reward-row"><div class="reward-main"><div class="reward-title">兑换码：${escapeHtml(item.code_value)} · ${escapeHtml(rewardLabel(item.reward))}</div><div class="reward-meta">${item.message ? `${escapeHtml(item.message)} · ` : ''}有效至 ${formatTime(item.expires_at)} · ${Number(item.used_count)}/${Number(item.max_uses)} 已领取</div></div><div class="reward-actions"><span class="state ${tone}">${label}</span><button class="secondary" type="button" onclick="copyRewardCode('${item.code_value}')">复制</button>${revoke}</div></div>`; }).join('') : '<div class="empty">还没有发放过日常奖励。</div>'; } catch (e) { list.innerHTML = '<div class="empty">奖励记录读取失败，请刷新重试。</div>'; } }
async function createRewardCode() { const button = document.getElementById('createRewardBtn'); const note = document.getElementById('rewardStatus'); button.disabled = true; note.textContent = '正在生成奖励码…'; try { const result = await SummerCloud.createRewardCode(document.getElementById('rewardKind').value, document.getElementById('rewardMessage').value.trim(), Number(document.getElementById('rewardDays').value)); document.getElementById('rewardMessage').value = ''; note.textContent = `奖励码 ${result.code} 已生成 · ${rewardLabel(result.reward)} · 有效至 ${formatTime(result.expiresAt)}`; await loadRewardCodes(); } catch (e) { note.textContent = e.message || '生成失败，请重试。'; } finally { button.disabled = false; } }
async function revokeRewardCode(id) { if (!window.confirm('确认撤销这份尚未领取的奖励吗？')) return; const note = document.getElementById('rewardStatus'); try { await SummerCloud.revokeRewardCode(id); note.textContent = '奖励码已撤销。'; await loadRewardCodes(); } catch (e) { note.textContent = e.message || '撤销失败，请重试。'; } }
async function copyRewardCode(code) { try { await navigator.clipboard.writeText(code); document.getElementById('rewardStatus').textContent = `奖励码 ${code} 已复制。`; } catch (e) { document.getElementById('rewardStatus').textContent = `奖励码：${code}`; } }
async function loadDashboard() { const note = document.getElementById('syncNote'); note.textContent = '正在读取云端记录…'; try { rows = await SummerCloud.fetchCheckins(7); setLogin(false); renderDashboard(); loadCodeStatus(); loadRewardCodes(); note.textContent = `已读取 ${rows.length} 天记录 · ${formatTime(new Date().toISOString())}`; } catch (e) { note.textContent = '读取失败，请检查网络或账号权限'; } }
function renderDashboard() { const today = dayKey(new Date()); const totalDone = rows.reduce((sum, row) => sum + Number(row.done_count || 0), 0); const totalTasks = rows.reduce((sum, row) => sum + Number(row.total_count || 0), 0); document.getElementById('weekRate').textContent = totalTasks ? `${Math.round(totalDone / totalTasks * 100)}%` : '—'; document.getElementById('weekHint').textContent = rows.length ? `${totalDone} / ${totalTasks} 项已完成` : '最近 7 天暂无同步记录'; const latest = rows.slice().sort((a,b) => new Date(b.last_synced_at) - new Date(a.last_synced_at))[0]; document.getElementById('lastSync').textContent = latest ? formatTime(latest.last_synced_at) : '—'; document.getElementById('lastSyncHint').textContent = latest ? `${formatDate(latest.check_date)}的打卡记录` : '等待小朋友端同步'; const todayRow = rowFor(today); document.getElementById('todayRate').textContent = todayRow ? `${todayRow.done_count}/${todayRow.total_count}` : '—'; document.getElementById('todayHint').textContent = todayRow ? (todayRow.is_full ? '今天已全部完成' : '今天仍有待完成任务') : '今天尚无同步'; const list = document.getElementById('weekList'); const dayRows = []; for (let i=0; i<7; i++) { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const key = dayKey(d); const row = rowFor(key); const pct = row && row.total_count ? Math.round(row.done_count / row.total_count * 100) : 0; dayRows.push(`<div class="day-row ${key === activeDate ? 'active' : ''}" onclick="selectDay('${key}')"><div class="date">${formatDate(key)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="pct">${row ? `${row.done_count}/${row.total_count}` : '未同步'}</div>${row && row.is_full ? '<span class="full">完成</span>' : ''}</div>`); } list.innerHTML = dayRows.join(''); if (!activeDate && rows.length) selectDay(rows[0].check_date); else if (activeDate) renderDetail(activeDate); }
function selectDay(key) { activeDate = key; renderDashboard(); } function renderDetail(key) { const row = rowFor(key); document.getElementById('detailHeading').textContent = formatDate(key); const badge = document.getElementById('detailBadge'); const box = document.getElementById('taskDetail'); if (!row) { badge.textContent = '未同步'; box.className = 'empty'; box.textContent = '这一天尚未从小朋友设备同步打卡记录。'; return; } badge.textContent = `${row.done_count}/${row.total_count} · ${row.is_full ? '已完成' : '进行中'}`; const tasks = tasksOf(row); const values = valuesOf(row); if (!tasks.length) { box.className = 'empty'; box.textContent = '这条是旧格式同步记录，未包含任务明细；之后重新同步即可显示。'; return; } box.className = ''; box.innerHTML = tasks.map((task) => `<div class="task ${values[task.id] ? 'done' : ''}"><span class="check"></span><div><div class="task-name">${escapeHtml(task.name)}<span class="tag">${task.period === 'morning' ? '上午' : task.period === 'afternoon' ? '下午' : '晚上'}</span></div><div class="task-detail">${escapeHtml(task.detail || '')}</div></div></div>`).join(''); }
(async function init() { if (!window.SummerCloud || !SummerCloud.isConfigured()) { document.getElementById('loginError').textContent = '云端配置缺失。'; return; } try { const session = await SummerCloud.getSession(); if (session && !session.user.is_anonymous) await loadDashboard(); else setLogin(true); } catch (e) { setLogin(true); } })();
</script></body></html>
