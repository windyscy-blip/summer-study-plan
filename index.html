<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑假学习计划</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: white; border-radius: 16px; padding: 40px; max-width: 420px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .card h1 { font-size: 24px; margin-bottom: 8px; }
  .card p { color: #888; margin-bottom: 28px; font-size: 14px; }
  .card a {
    display: block; padding: 14px 24px; margin-bottom: 12px;
    border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 16px;
    transition: transform .15s;
  }
  .card a:hover { transform: translateY(-2px); }
  .btn-daily { background: #667eea; color: white; }
  .btn-plan { background: #f0f0ec; color: #333; }
</style>
</head>
<body>
<div class="card">
  <h1>📚 暑假学习计划</h1>
  <p>二升三 · 上海小学生</p>
  <a class="btn-daily" href="每日打卡.html">📅 每日打卡</a>
  <a class="btn-plan" href="暑假学习计划表.html">📋 完整计划表</a>
</div>
</body>
</html>
