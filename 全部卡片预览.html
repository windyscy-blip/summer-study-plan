<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全部卡片预览</title>
  <style>
    :root {
      --bg: linear-gradient(180deg, #fffaff 0%, #fff7fd 52%, #f7fbff 100%);
      --panel: rgba(255,255,255,.92);
      --text: #4a3a66;
      --sub: #7c6f95;
      --border: rgba(170,145,243,.16);
      --shadow: 0 18px 40px rgba(136, 98, 210, .12);
      --r: #5c9dff;
      --sr: #9a63ff;
      --ssr: #f0bb3d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body.overlay-open {
      overflow: hidden;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      overflow-x: clip;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .hero-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 30px;
      font-weight: 900;
    }

    .hero-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe4f1, #eaf5ff);
      box-shadow: 0 12px 24px rgba(150, 112, 228, .14);
    }

    .hero-sub {
      margin-top: 8px;
      max-width: 760px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      text-decoration: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 900;
      color: var(--text);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .summary-card .k {
      font-size: 12px;
      color: var(--sub);
      font-weight: 800;
    }

    .summary-card .v {
      margin-top: 6px;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1;
    }

    .summary-card .t {
      margin-top: 6px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.7;
    }

    .board {
      display: grid;
      gap: 20px;
    }

    .group {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .group-head h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    .rarity-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      color: white;
      font-size: 12px;
      font-weight: 900;
      min-width: 48px;
    }

    .rarity-pill.r { background: linear-gradient(135deg, var(--r), #3c7af1); }
    .rarity-pill.sr { background: linear-gradient(135deg, var(--sr), #7f42df); }
    .rarity-pill.ssr { background: linear-gradient(135deg, var(--ssr), #d59300); }

    .group-meta {
      color: var(--sub);
      font-size: 12px;
      font-weight: 800;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(214px, 1fr));
      gap: 16px;
    }

    .catalog-tile {
      display: grid;
      gap: 10px;
    }

    .pony-card {
      position: relative;
      width: 100%;
      max-width: 214px;
      aspect-ratio: 63 / 88;
      margin: 0 auto;
      border-radius: 24px;
      padding: 5px;
      background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.2));
      transition: transform .18s ease, filter .18s ease;
      overflow: hidden;
    }

    .pony-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(255,255,255,0) 12%, rgba(255,255,255,.34) 44%, rgba(255,255,255,0) 76%);
      transform: translateX(-130%);
      pointer-events: none;
      opacity: .9;
    }

    .pony-card:hover {
      transform: translateY(-4px) scale(1.01);
      filter: drop-shadow(0 18px 28px rgba(136, 98, 210, .18));
    }

    .pony-card:hover::before { animation: cardSweep 1s ease forwards; }

    @media (hover: none) and (pointer: coarse), (max-width: 1024px) {
      .pony-card:hover {
        transform: none;
        filter: none;
      }

      .pony-card:hover::before {
        animation: none;
      }

      .pony-card.ssr:hover {
        box-shadow: inset 0 0 0 2px rgba(243,190,68,.9),
                    0 0 20px 5px rgba(243,190,68,.4),
                    0 12px 20px rgba(227, 170, 30, .2);
      }

      .pony-card.ssr:hover .pony-card-front.ssr::after {
        animation-duration: 5s;
        opacity: .65;
      }
    }

    @keyframes cardSweep {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(135%); }
    }

    @keyframes holoFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .pony-card.r { box-shadow: inset 0 0 0 2px rgba(95,168,255,.78), 0 10px 18px rgba(95,168,255,.12); }
    .pony-card.sr { box-shadow: inset 0 0 0 2px rgba(155,99,255,.82), 0 10px 18px rgba(155,99,255,.14); }
    .pony-card.ssr {
      box-shadow: inset 0 0 0 2px rgba(243,190,68,.9), 
                  0 0 20px 5px rgba(243,190,68,.4), 
                  0 12px 20px rgba(227, 170, 30, .2);
    }

    .pony-card.ssr::before {
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0) 10%,
        rgba(255, 240, 180, 0.6) 40%,
        rgba(255, 255, 255, 0.8) 50%,
        rgba(255, 240, 180, 0.6) 60%,
        rgba(255, 255, 255, 0) 90%
      );
      width: 150%;
      animation: cardSweep 3s ease-in-out infinite;
    }

    .pony-card.ssr:hover {
      box-shadow: inset 0 0 0 2px rgba(255, 215, 0, 1),
                  0 0 30px 10px rgba(243, 190, 68, 0.6),
                  0 18px 28px rgba(227, 170, 30, 0.4);
    }

    .pony-card.ssr:hover .pony-card-front.ssr::after {
      animation-duration: 2s;
      opacity: 0.8;
    }

    .pony-card-inner {
      height: 100%;
      border-radius: 21px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.84));
    }

    .pony-card-front {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 6px 7px 12px;
      position: relative;
      cursor: pointer;
    }

    .pony-card-front::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 17px;
      border: 1px solid rgba(255,255,255,.28);
      pointer-events: none;
    }

    .pony-card-front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.26), transparent 48%, rgba(255,255,255,.08));
      pointer-events: none;
    }

    .pony-card-front.ssr::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(255, 0, 0, 0.15),
        rgba(255, 165, 0, 0.15),
        rgba(255, 255, 0, 0.15),
        rgba(0, 128, 0, 0.15),
        rgba(0, 0, 255, 0.15),
        rgba(75, 0, 130, 0.15),
        rgba(238, 130, 238, 0.15)
      );
      background-size: 300% 300%;
      animation: holoFlow 5s linear infinite;
      mix-blend-mode: color-dodge;
      pointer-events: none;
      z-index: 2;
    }

    .pony-card-front.sr::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.4) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      background-size: 200% 200%;
      animation: holoFlow 8s linear infinite;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 2;
    }

    .pony-card-front.r { background: linear-gradient(180deg, rgba(224,241,255,.66), rgba(255,255,255,.78)); }
    .pony-card-front.sr { background: linear-gradient(180deg, rgba(241,228,255,.72), rgba(255,255,255,.8)); }
    .pony-card-front.ssr {
      background:
        radial-gradient(circle at 16% 16%, rgba(255,255,255,.46), transparent 26%),
        linear-gradient(180deg, rgba(255,241,198,.84), rgba(255,255,255,.82));
    }

    .card-back-face {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .card-back-face.r {
      --back-ring-size: 116px;
      --back-ring-border: 2px solid rgba(255,255,255,.52);
      --back-ring-shadow: 0 0 0 8px rgba(255,255,255,.1), 0 0 0 16px rgba(255,255,255,.05);
      --back-frame-border: 1px solid rgba(255,255,255,.34);
      --back-frame-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
      --back-corner-border: 1px solid rgba(255,255,255,.34);
      --back-corner-shadow: none;
      --back-corner-opacity: .5;
      --back-mark-color: #ffffff;
      --back-mark-scale: 1;
      --back-mark-shadow: 0 10px 18px rgba(83, 120, 185, .16);
      --back-note-bg: rgba(255,255,255,.18);
      --back-note-shadow: inset 0 0 0 1px rgba(255,255,255,.24);
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,.16), transparent 34%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 16px),
        linear-gradient(145deg, #dfefff 0%, #7fb4ff 56%, #ebf7ff 100%);
    }

    .card-back-face.sr {
      --back-ring-size: 122px;
      --back-ring-border: 2px solid rgba(255,255,255,.68);
      --back-ring-shadow: 0 0 0 8px rgba(255,255,255,.12), 0 0 0 18px rgba(171,140,255,.12);
      --back-frame-border: 1px solid rgba(255,255,255,.46);
      --back-frame-shadow: inset 0 0 0 1px rgba(255,255,255,.1), inset 0 0 0 8px rgba(255,255,255,.03);
      --back-corner-border: 1px solid rgba(255,255,255,.48);
      --back-corner-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
      --back-corner-opacity: .62;
      --back-mark-color: #ffffff;
      --back-mark-scale: 1;
      --back-mark-shadow: 0 0 16px rgba(255,255,255,.24), 0 10px 18px rgba(116,73,191,.2);
      --back-note-bg: linear-gradient(135deg, rgba(255,255,255,.24), rgba(255,255,255,.12));
      --back-note-shadow: inset 0 0 0 1px rgba(255,255,255,.28), 0 8px 18px rgba(118,81,197,.14);
      background:
        radial-gradient(circle at 50% 33%, rgba(255,255,255,.24), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,.16), transparent 28%, rgba(255,255,255,.08) 52%, transparent 72%),
        repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 1px, transparent 1px 12px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.08) 0 1px, transparent 1px 18px),
        linear-gradient(145deg, #f2e4ff 0%, #9b63ff 42%, #7d58e7 64%, #eef6ff 100%);
    }

    .card-back-face.ssr {
      --back-ring-size: 128px;
      --back-ring-border: 2px solid rgba(255,249,225,.8);
      --back-ring-shadow: 0 0 0 8px rgba(255,250,226,.16), 0 0 0 18px rgba(255,232,165,.14), 0 0 32px rgba(243,190,68,.16);
      --back-frame-border: 1px solid rgba(255,246,217,.62);
      --back-frame-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 0 0 10px rgba(255,241,196,.04);
      --back-corner-border: 1px solid rgba(255,244,209,.72);
      --back-corner-shadow: 0 0 0 1px rgba(255,236,181,.16) inset, 0 0 18px rgba(255,221,132,.12);
      --back-corner-opacity: .78;
      --back-mark-color: #fff9ea;
      --back-mark-scale: 1.05;
      --back-mark-shadow: 0 0 18px rgba(255,244,204,.42), 0 10px 18px rgba(173,118,12,.18);
      --back-note-bg: linear-gradient(135deg, rgba(255,249,228,.34), rgba(255,255,255,.18));
      --back-note-shadow: inset 0 0 0 1px rgba(255,246,215,.4), 0 10px 20px rgba(184,123,8,.16);
      background:
        radial-gradient(circle at 50% 31%, rgba(255,255,255,.3), transparent 35%),
        repeating-conic-gradient(from -6deg at 50% 50%, rgba(255,247,213,.24) 0deg 6deg, transparent 6deg 18deg),
        repeating-linear-gradient(0deg, rgba(255,255,255,.16) 0 1px, transparent 1px 14px),
        repeating-linear-gradient(90deg, rgba(255,243,208,.14) 0 1px, transparent 1px 14px),
        linear-gradient(145deg, #fff6de 0%, #f7d46e 32%, #f1bd42 54%, #ffe4f0 82%, #fffbf3 100%);
    }

    .card-back-face::before {
      content: "";
      position: absolute;
      width: var(--back-ring-size, 118px);
      height: var(--back-ring-size, 118px);
      border-radius: 50%;
      border: var(--back-ring-border, 2px solid rgba(255,255,255,.56));
      background: radial-gradient(circle, rgba(255,255,255,.08), transparent 68%);
      box-shadow: var(--back-ring-shadow, 0 0 0 10px rgba(255,255,255,.12), 0 0 0 18px rgba(255,255,255,.08));
    }

    .card-back-face::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 14px;
      border: var(--back-frame-border, 1px solid rgba(255,255,255,.34));
      box-shadow: var(--back-frame-shadow, inset 0 0 0 1px rgba(255,255,255,.08));
    }

    .back-corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: var(--back-corner-border, 1px solid rgba(255,255,255,.34));
      box-shadow: var(--back-corner-shadow, none);
      transform: rotate(45deg);
      opacity: var(--back-corner-opacity, .5);
    }

    .back-center .mark {
      display: inline-block;
      font-size: 34px;
      line-height: 1;
      color: var(--back-mark-color, #fff);
      transform: scale(var(--back-mark-scale, 1));
      text-shadow: var(--back-mark-shadow, 0 10px 18px rgba(116, 73, 191, .18));
    }

    .back-center .unlock-note {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--back-note-bg, rgba(255,255,255,.18));
      box-shadow: var(--back-note-shadow, inset 0 0 0 1px rgba(255,255,255,.24));
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .4px;
      white-space: nowrap;
    }

    .card-topline {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .card-name {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .card-number {
      margin-top: 3px;
      font-size: 10px;
      color: rgba(75,63,102,.56);
      letter-spacing: .8px;
      font-weight: 900;
    }

    .rarity-badge {
      min-width: 42px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 6px 12px rgba(112, 80, 189, .15);
    }

    .rarity-badge.r { background: linear-gradient(135deg, var(--r), #3c7af1); }
    .rarity-badge.sr { background: linear-gradient(135deg, var(--sr), #7f42df); }
    .rarity-badge.ssr { background: linear-gradient(135deg, var(--ssr), #d59300); }

    .card-art {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 190px;
      margin: 0 0 2px;
      position: relative;
      z-index: 1;
    }

    .card-art::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.52), rgba(255,255,255,0) 74%);
    }

    .card-art svg,
    .card-art img {
      width: 180px;
      height: 180px;
      border-radius: 18px;
      object-fit: cover;
      display: block;
      filter: drop-shadow(0 12px 18px rgba(117, 76, 188, .18));
      position: relative;
      z-index: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-end;
      position: relative;
      z-index: 1;
      padding-bottom: 2px;
    }

    .card-skill {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.42;
      min-width: 0;
      padding-bottom: 1px;
    }

    .card-series {
      margin-top: 3px;
      font-size: 9px;
      line-height: 1.2;
      letter-spacing: .55px;
      color: rgba(75,63,102,.58);
      font-weight: 800;
    }

    .pony-card.card-context-detail .card-art {
      min-height: 184px;
      margin-bottom: 0;
    }

    .pony-card.card-context-detail .card-footer {
      padding-bottom: 0;
      transform: translateY(-4px);
    }

    .pony-card.card-context-detail .card-series {
      margin-top: 2px;
    }

    .card-count {
      min-width: 30px;
      height: 30px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      box-shadow: inset 0 0 0 1px rgba(170,145,243,.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #6b5a83;
    }

    .note {
      padding: 0 6px;
    }

    .note .name {
      font-size: 14px;
      font-weight: 900;
    }

    .note .desc {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.7;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(70, 46, 110, .34);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 60;
      backdrop-filter: blur(8px);
    }

    .modal.show { display: flex; }

    .page-lock-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(32, 21, 54, .78);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .page-lock-overlay.show {
      display: flex;
    }

    .page-lock-card {
      width: min(440px, 100%);
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(170,145,243,.18);
      border-radius: 24px;
      box-shadow: 0 28px 60px rgba(28, 18, 48, .34);
      padding: 24px 22px 22px;
      text-align: center;
    }

    .page-lock-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: linear-gradient(135deg, #efe5ff, #e8f4ff);
      box-shadow: 0 10px 22px rgba(125, 89, 205, .18);
    }

    .page-lock-form {
      margin-top: 18px;
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .page-lock-input {
      width: 100%;
      border: 1px solid rgba(170,145,243,.24);
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.5);
    }

    .page-lock-input:focus {
      border-color: rgba(136, 98, 210, .52);
      box-shadow: 0 0 0 4px rgba(136, 98, 210, .12);
    }

    .page-lock-error {
      min-height: 20px;
      font-size: 12px;
      color: #d14c74;
      font-weight: 700;
      padding-left: 2px;
    }

    .page-lock-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .page-lock-btn,
    .page-lock-link {
      min-width: 130px;
      border: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }

    .page-lock-btn {
      color: #fff;
      background: linear-gradient(135deg, #9a63ff, #6d8fff);
      box-shadow: 0 12px 24px rgba(109, 98, 210, .22);
    }

    .page-lock-link {
      color: var(--text);
      background: linear-gradient(135deg, #f8efff, #eef8ff);

    function buildCardTile(card, count = 1, context = '') {
      const cls = rarityClass(card.rarity);
      const seriesCode = `MLP-${card.rarity}-${card.id.slice(-3).toUpperCase()}`;
      return `
        <div class="pony-card ${cls} ${context === 'detail' ? 'card-context-detail' : ''}">
          <div class="pony-card-inner">
            <div class="pony-card-front ${cls}" onclick="openCardDetail('${card.id}')">
              <div class="card-topline">
                <div>
                  <div class="card-name">${card.name}</div>
                  <div class="card-number">${seriesCode}</div>
                </div>
                <span class="rarity-badge ${cls}">${card.rarity}</span>
              </div>
              <div class="card-art">${buildPonySvg(card)}</div>
              <div class="card-footer">
                <div class="card-skill">${card.accent}<br>${card.skill}<div class="card-series">COLLECTOR EDITION</div></div>
                <span class="card-count">x${count}</span>
              </div>
            </div>
          </div>
        </div>`;
    }

    function getCard(cardId) {
      return CARD_POOL.find((card) => card.id === cardId);
    }

    function openCardDetail(cardId) {
      const card = getCard(cardId);
      if (!card) return;
      document.getElementById('detailTitle').textContent = card.name;
      document.getElementById('cardDetailBody').innerHTML = `
        <div class="card-detail-grid">
          <div>${buildCardTile(card, 1, 'detail')}</div>
          <div class="detail-main">
            <div class="detail-headline">
              <div class="detail-name-wrap">
                <div class="detail-name">${card.name}</div>
                <div class="detail-sub">${card.description}</div>
              </div>
            </div>
            <div class="detail-tags">
              <span class="detail-tag">主题：${card.accent}</span>
              <span class="detail-tag">技能：${card.skill}</span>
            </div>
            <div class="detail-copy-grid">
              <div class="detail-box">
                <div class="k">定位 / 技能</div>
                <div class="v">${card.persona || `${card.accent} / ${card.skill}`}</div>
              </div>
              <div class="detail-box">
                <div class="k">性格</div>
                <div class="v">${card.personality || '轻盈温柔，适合陪伴学习。'}</div>
              </div>
              <div class="detail-box full">
                <div class="k">卡片故事</div>
                <div class="v">${card.story || card.description}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-modal-actions">
          <button class="card-action secondary" type="button" onclick="closeModal('cardDetailModal')">关闭</button>
        </div>`;
      openModal('cardDetailModal');
    }

    const PAGE_PREVIEW_PASSWORD = '654321';

    function syncOverlayLock() {
      const hasOverlay = document.querySelector('.modal.show') || document.getElementById('pageLockOverlay')?.classList.contains('show');
      document.body.classList.toggle('overlay-open', !!hasOverlay);
    }

    function unlockPreviewPage() {
      document.getElementById('pageLockOverlay').classList.remove('show');
      document.getElementById('pageLockError').textContent = '';
      syncOverlayLock();
    }

    function submitPagePassword() {
      const input = document.getElementById('pageLockInput');
      const error = document.getElementById('pageLockError');
      const value = (input.value || '').trim();
      if (value === PAGE_PREVIEW_PASSWORD) {
        unlockPreviewPage();
        return;
      }
      error.textContent = '口令不正确，请重新输入。';
      input.focus();
      input.select();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (document.getElementById('pageLockOverlay').classList.contains('show')) return;
      if (document.getElementById('cardDetailModal').classList.contains('show')) {
        closeModal('cardDetailModal');
      }
    });

    function openModal(id) {
      document.getElementById(id).classList.add('show');
      syncOverlayLock();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
      syncOverlayLock();
    }

    function closeModalOnMask(event, id) {
      if (event.target.id === id) closeModal(id);
    }

    function render() {
      const board = document.getElementById('board');
      const groups = {
        R: CARD_POOL.filter((card) => card.rarity === 'R'),
        SR: CARD_POOL.filter((card) => card.rarity === 'SR'),
        SSR: CARD_POOL.filter((card) => card.rarity === 'SSR')
      };

      document.getElementById('allCount').textContent = CARD_POOL.length;
      document.getElementById('rCount').textContent = groups.R.length;
      document.getElementById('srCount').textContent = groups.SR.length;
      document.getElementById('ssrCount').textContent = groups.SSR.length;

      board.innerHTML = ['R', 'SR', 'SSR'].map((rarity) => `
        <section class="group">
          <div class="group-head">
            <h2><span class="rarity-pill ${rarityClass(rarity)}">${rarity}</span>${rarity} 卡正面预览</h2>
            <div class="group-meta">共 ${groups[rarity].length} 张</div>
          </div>
          <div class="card-grid">
            ${groups[rarity].map((card) => `
              <div class="catalog-tile">
                ${buildCardTile(card)}
                <div class="note">
                  <div class="name">${card.name} · ${card.rarity}</div>
                  <div class="desc">${card.description}<br>主题：${card.accent} · 能力：${card.skill}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `).join('');
    }

    render();
    syncOverlayLock();
    const pageLockInput = document.getElementById('pageLockInput');
    pageLockInput.focus();
    pageLockInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') submitPagePassword();
    });
  </script>
</body>
</html>
