<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全部卡片预览</title>
  <style>
    :root {
      --bg: linear-gradient(180deg, #fffaff 0%, #fff7fd 52%, #f7fbff 100%);
      --panel: rgba(255,255,255,.92);
      --text: #4a3a66;
      --sub: #7c6f95;
      --border: rgba(170,145,243,.16);
      --shadow: 0 18px 40px rgba(136, 98, 210, .12);
      --r: #5c9dff;
      --sr: #9a63ff;
      --ssr: #f0bb3d;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .hero-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 30px;
      font-weight: 900;
    }

    .hero-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe4f1, #eaf5ff);
      box-shadow: 0 12px 24px rgba(150, 112, 228, .14);
    }

    .hero-sub {
      margin-top: 8px;
      max-width: 760px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      text-decoration: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 900;
      color: var(--text);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .summary-card .k {
      font-size: 12px;
      color: var(--sub);
      font-weight: 800;
    }

    .summary-card .v {
      margin-top: 6px;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1;
    }

    .summary-card .t {
      margin-top: 6px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.7;
    }

    .board {
      display: grid;
      gap: 20px;
    }

    .group {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .group-head h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    .rarity-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      color: white;
      font-size: 12px;
      font-weight: 900;
      min-width: 48px;
    }

    .rarity-pill.r { background: linear-gradient(135deg, var(--r), #3c7af1); }
    .rarity-pill.sr { background: linear-gradient(135deg, var(--sr), #7f42df); }
    .rarity-pill.ssr { background: linear-gradient(135deg, var(--ssr), #d59300); }

    .group-meta {
      color: var(--sub);
      font-size: 12px;
      font-weight: 800;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .catalog-tile {
      display: grid;
      gap: 10px;
    }

    .pony-card {
      position: relative;
      border-radius: 24px;
      padding: 5px;
      min-height: 258px;
      background: linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,255,255,.2));
      transition: transform .18s ease, filter .18s ease;
      overflow: hidden;
    }

    .pony-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(255,255,255,0) 12%, rgba(255,255,255,.34) 44%, rgba(255,255,255,0) 76%);
      transform: translateX(-130%);
      pointer-events: none;
      opacity: .9;
    }

    .pony-card:hover {
      transform: translateY(-4px) scale(1.01);
      filter: drop-shadow(0 18px 28px rgba(136, 98, 210, .18));
    }

    .pony-card:hover::before { animation: cardSweep 1s ease forwards; }

    @keyframes cardSweep {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(135%); }
    }

    .pony-card.r { box-shadow: inset 0 0 0 2px rgba(95,168,255,.78), 0 10px 18px rgba(95,168,255,.12); }
    .pony-card.sr { box-shadow: inset 0 0 0 2px rgba(155,99,255,.82), 0 10px 18px rgba(155,99,255,.14); }
    .pony-card.ssr { box-shadow: inset 0 0 0 2px rgba(243,190,68,.9), 0 12px 20px rgba(227, 170, 30, .2); }

    .pony-card-inner {
      height: 100%;
      border-radius: 19px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.84));
    }

    .pony-card-front {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 248px;
      height: 100%;
      padding: 12px;
      position: relative;
      cursor: default;
    }

    .pony-card-front::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.3);
      pointer-events: none;
    }

    .pony-card-front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.26), transparent 48%, rgba(255,255,255,.08));
      pointer-events: none;
    }

    .pony-card-front.r { background: linear-gradient(180deg, rgba(224,241,255,.66), rgba(255,255,255,.78)); }
    .pony-card-front.sr { background: linear-gradient(180deg, rgba(241,228,255,.72), rgba(255,255,255,.8)); }
    .pony-card-front.ssr {
      background:
        radial-gradient(circle at 16% 16%, rgba(255,255,255,.46), transparent 26%),
        linear-gradient(180deg, rgba(255,241,198,.84), rgba(255,255,255,.82));
    }

    .card-topline {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .card-name {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .card-number {
      margin-top: 3px;
      font-size: 10px;
      color: rgba(75,63,102,.56);
      letter-spacing: .8px;
      font-weight: 900;
    }

    .rarity-badge {
      min-width: 42px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 6px 12px rgba(112, 80, 189, .15);
    }

    .rarity-badge.r { background: linear-gradient(135deg, var(--r), #3c7af1); }
    .rarity-badge.sr { background: linear-gradient(135deg, var(--sr), #7f42df); }
    .rarity-badge.ssr { background: linear-gradient(135deg, var(--ssr), #d59300); }

    .card-art {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 146px;
      position: relative;
      z-index: 1;
    }

    .card-art::before {
      content: "";
      position: absolute;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
    }

    .card-art svg {
      width: 100%;
      max-width: 132px;
      filter: drop-shadow(0 12px 18px rgba(117, 76, 188, .18));
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: end;
      position: relative;
      z-index: 1;
    }

    .card-skill {
      color: var(--sub);
      font-size: 12px;
      line-height: 1.58;
    }

    .card-series {
      margin-top: 4px;
      font-size: 10px;
      letter-spacing: .7px;
      color: rgba(75,63,102,.58);
      font-weight: 800;
    }

    .card-count {
      min-width: 30px;
      height: 30px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      box-shadow: inset 0 0 0 1px rgba(170,145,243,.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #6b5a83;
    }

    .note {
      padding: 0 6px;
    }

    .note .name {
      font-size: 14px;
      font-weight: 900;
    }

    .note .desc {
      margin-top: 4px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .shell { padding: 20px 14px 32px; }
      .hero-title { font-size: 24px; }
      .summary { grid-template-columns: 1fr; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div>
        <div class="hero-title"><span class="hero-icon">✨</span><span>全部卡片预览</span></div>
        <div class="hero-sub">这是独立页面，直接展示所有卡片的正面，不受是否已解锁限制。你可以直接看每一张卡的风格、配色、主题和描述，再告诉我想优化哪几张。</div>
      </div>
      <div class="hero-actions">
        <a class="action-btn" href="每日打卡.html">返回每日打卡</a>
      </div>
    </section>

    <section class="summary">
      <div class="summary-card"><div class="k">总卡数</div><div class="v" id="allCount">0</div><div class="t">当前卡池的全部卡片数量</div></div>
      <div class="summary-card"><div class="k">R 卡</div><div class="v" id="rCount">0</div><div class="t">基础收藏卡</div></div>
      <div class="summary-card"><div class="k">SR 卡</div><div class="v" id="srCount">0</div><div class="t">进阶高闪卡</div></div>
      <div class="summary-card"><div class="k">SSR 卡</div><div class="v" id="ssrCount">0</div><div class="t">大奖收藏卡</div></div>
    </section>

    <section class="board" id="board"></section>
  </div>

  <script>
    const CARD_POOL = [
      { id: 'r-apple-glow', rarity: 'R', name: '苹果晨光', skill: '晨读能量', description: '清晨系 R 卡，适合配合语文晨读和字词复习。', colors: { a: '#ffc3d4', b: '#ff76a8', c: '#ffe38a', mane1: '#ff6a98', mane2: '#ffcc4d', body: '#fff8fd' }, mark: '✦', accent: '晨读之星' },

      { id: 'r-mint-hop', rarity: 'R', name: '薄荷跳跳', skill: '数感冲刺', description: '清新数感系 R 卡，适合数学练习日。', colors: { a: '#ddfff2', b: '#86e0be', c: '#d9f5ff', mane1: '#5fd2aa', mane2: '#65c7ff', body: '#f8fffd' }, mark: '◆', accent: '数感闪光' },
      { id: 'r-sea-star', rarity: 'R', name: '海盐星铃', skill: '单词记忆', description: '蓝调背词系 R 卡，适合单词抄写 + 默写。', colors: { a: '#e5f2ff', b: '#7fb7ff', c: '#fff0f8', mane1: '#79a7ff', mane2: '#ff87c7', body: '#ffffff' }, mark: '✧', accent: '单词清铃' },

      { id: 'r-rain-step', rarity: 'R', name: '雨滴飞飞', skill: '动画补给', description: '轻松输入系 R 卡，适合动画片和单词小超市。', colors: { a: '#e7f9ff', b: '#78d1ff', c: '#eef0ff', mane1: '#6dc8ff', mane2: '#8e86ff', body: '#fbffff' }, mark: '✿', accent: '轻松输入' },
      { id: 'r-lemon-note', rarity: 'R', name: '柠檬练练', skill: '订正耐心', description: '练习订正系 R 卡，提醒做完后别忘了订正。', colors: { a: '#fff8cb', b: '#ffd96a', c: '#ffe5f6', mane1: '#ffd45b', mane2: '#ff92cd', body: '#fffef7' }, mark: '♫', accent: '订正闪记' },
      { id: 'sr-rainbow-dash', rarity: 'SR', name: '彩虹逐风', skill: '满进度加速', description: '高闪 SR 卡，适合状态特别好的满进度日。', colors: { a: '#dff7ff', b: '#62c4ff', c: '#ffe6f8', mane1: '#ff73aa', mane2: '#6f85ff', body: '#ffffff' }, mark: '⚡', accent: '彩虹冲刺' },
      { id: 'sr-purple-magic', rarity: 'SR', name: '紫晶星语', skill: '专注魔法', description: '紫系 SR 卡，适合课程期间也不掉节奏的时候。', colors: { a: '#efe4ff', b: '#a77dff', c: '#ffdff1', mane1: '#8f63ff', mane2: '#ff91cb', body: '#fffaff' }, mark: '✪', accent: '专注魔法' },

      { id: 'ssr-sun-crown', rarity: 'SSR', name: '日冕王冠', skill: '七日大奖', description: '金边 SSR 卡，只能通过 7 天满进度随机掉落。', colors: { a: '#fff6d6', b: '#f4c34b', c: '#ffe4ef', mane1: '#f3ba34', mane2: '#ff8db7', body: '#fffdf7' }, mark: '♛', accent: '日冕闪耀' },
      { id: 'ssr-galaxy-dream', rarity: 'SSR', name: '银河梦境', skill: '终极收藏', description: '梦幻 SSR 卡，只能通过 7 天满进度随机掉落。', colors: { a: '#f6e9ff', b: '#bd87ff', c: '#fff3d2', mane1: '#9a66ff', mane2: '#ffcf67', body: '#fffaff' }, mark: '✵', accent: '梦境王座' }
    ];

    function rarityClass(rarity) {
      return rarity === 'SSR' ? 'ssr' : rarity === 'SR' ? 'sr' : 'r';
    }

function buildPonySvg(card) {
  const c = card.colors;
  const rarity = card.rarity;
  const decoMap = {
    'r-apple-glow': { icon: '🍎', orbit: 'none', frame: 'none', background: 'apple-clean', pedestal: 'none', headpiece: 'none', tail: 'basic' },
    'r-cloud-bubble': { icon: '☁', orbit: 'none', frame: 'none', background: 'cloud-clean', pedestal: 'none', headpiece: 'none', tail: 'basic' },
    'r-mint-hop': { icon: '◆', orbit: 'mint', frame: 'spark', background: 'mint-soft', pedestal: 'none', headpiece: 'none', tail: 'basic' },

    'r-lemon-note': { icon: '♫', orbit: 'note', frame: 'notes', background: 'note-soft', pedestal: 'none', headpiece: 'none', tail: 'basic' },
    'sr-rainbow-dash': { icon: '⚡', orbit: 'rainbow', frame: 'flare', background: 'rainbow-rich', pedestal: 'rainbow-band', headpiece: 'none', tail: 'basic' },
    'sr-purple-magic': { icon: '✪', orbit: 'magic', frame: 'gems', background: 'magic-rich', pedestal: 'magic-band', headpiece: 'none', tail: 'basic' },
    'sr-moon-berry': { icon: '☾', orbit: 'moon', frame: 'stars', background: 'moon-rich', pedestal: 'moon-band', headpiece: 'none', tail: 'basic' },
    'sr-aurora-glow': { icon: '✺', orbit: 'aurora', frame: 'aurora', background: 'aurora-rich', pedestal: 'aurora-band', headpiece: 'none', tail: 'basic' },
    'ssr-sun-crown': { icon: '♛', orbit: 'sun', frame: 'royal', background: 'sun-palace', pedestal: 'sun-band', headpiece: 'sun-tiara', tail: 'royal-tail' },
    'ssr-galaxy-dream': { icon: '✵', orbit: 'galaxy', frame: 'cosmic', background: 'galaxy-rich', pedestal: 'comet-band', headpiece: 'star-circlet', tail: 'galaxy-tail' }

  const deco = decoMap[card.id] || {
    icon: card.mark,

    background: rarity === 'SSR' ? 'galaxy-rich' : rarity === 'SR' ? 'magic-rich' : 'apple-soft',
    pedestal: rarity === 'SSR' ? 'comet-band' : rarity === 'SR' ? 'magic-band' : 'none',
    headpiece: rarity === 'SSR' ? 'star-circlet' : 'none',
    tail: rarity === 'SSR' ? 'galaxy-tail' : 'basic'
  };

  function backdrop() {
    switch (deco.background) {
      case 'apple-clean':
        return `<rect x="32" y="34" width="112" height="128" rx="32" fill="rgba(255,188,205,.62)"/><rect x="40" y="44" width="96" height="108" rx="28" fill="rgba(255,236,191,.34)"/><path d="M52 156c18-8 36-9 56-4 10 2 20 2 30 0" fill="none" stroke="rgba(255,151,185,.36)" stroke-width="8" stroke-linecap="round"/><path d="M106 50c8-9 17-13 27-12 1 11-3 20-11 26-9 0-17-5-24-15 2-4 5-7 8-9z" fill="rgba(255,112,156,.52)"/><circle cx="71" cy="58" r="13" fill="rgba(255,224,132,.86)"/>`;

      case 'apple-soft':
        return `<rect x="14" y="18" width="140" height="156" rx="36" fill="rgba(255,138,176,.4)"/><rect x="22" y="28" width="124" height="134" rx="32" fill="rgba(255,221,139,.28)"/><path d="M18 164c18-8 39-10 62-5 19 4 38 4 56 0 11-2 21-5 30-10v25H18z" fill="rgba(148,223,160,.42)"/><circle cx="36" cy="40" r="14" fill="rgba(255,236,165,.8)"/><path d="M116 42c8-8 16-11 24-10 1 10-2 18-9 24-9 1-17-4-24-14 3-3 6-6 9-8z" fill="rgba(255,126,164,.48)"/>`;

  function headpieceMarkup() {

  function tailMarkup() {
    switch (deco.tail) {
      case 'royal-tail':
        return `<path d="M28 116c-18 8-28 24-24 39 4 14 17 22 35 22-12-5-18-11-18-19 11 3 22-1 30-10-15-2-22-11-23-32z" fill="url(#mane-${card.id})" opacity=".98"/><path d="M14 138c8 6 16 8 24 7" fill="none" stroke="rgba(255,233,162,.58)" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="152" r="2.5" fill="rgba(255,242,201,.72)"/>`;
      case 'galaxy-tail':
        return `<path d="M26 112c-20 7-31 24-27 42 4 17 18 27 38 27-13-6-19-14-18-23 12 5 24 2 34-8-17-3-24-13-27-38z" fill="url(#mane-${card.id})" opacity="1"/><circle cx="10" cy="144" r="3" fill="rgba(255,255,255,.62)"/><circle cx="20" cy="160" r="2" fill="rgba(255,223,123,.58)"/><path d="M18 134c8 3 14 3 20 0" fill="none" stroke="rgba(188,176,255,.5)" stroke-width="2.5" stroke-linecap="round"/>`;
      default:
        return `<path d="M30 118c-18 8-27 22-24 37 4 14 16 21 32 21-10-5-16-10-16-18 11 3 21 0 28-8-14-2-20-10-20-32z" fill="url(#mane-${card.id})" opacity=".95"/>`;

  const aura = rarity === 'SSR'
    ? '<circle cx="90" cy="92" r="58" fill="rgba(255,231,160,.26)"/><circle cx="90" cy="92" r="70" fill="none" stroke="rgba(255,240,205,.42)" stroke-width="3" stroke-dasharray="10 8"/>'
    : rarity === 'SR'
      ? '<circle cx="90" cy="94" r="50" fill="rgba(255,255,255,.2)"/><circle cx="90" cy="94" r="60" fill="none" stroke="rgba(255,255,255,.24)" stroke-width="2.5" stroke-dasharray="8 7"/>'
      : '<circle cx="90" cy="98" r="44" fill="rgba(255,255,255,.12)"/>';

        </g>
      </g>

}



    function buildCardTile(card) {
      const cls = rarityClass(card.rarity);
      const seriesCode = `MLP-${card.rarity}-${card.id.slice(-3).toUpperCase()}`;
      return `
        <div class="pony-card ${cls}">
          <div class="pony-card-inner">
            <div class="pony-card-front ${cls}">
              <div class="card-topline">
                <div>
                  <div class="card-name">${card.name}</div>
                  <div class="card-number">${seriesCode}</div>
                </div>
                <span class="rarity-badge ${cls}">${card.rarity}</span>
              </div>
              <div class="card-art">${buildPonySvg(card)}</div>
              <div class="card-footer">
                <div class="card-skill">${card.accent}<br>${card.skill}<div class="card-series">COLLECTOR EDITION</div></div>
                <span class="card-count">x1</span>
              </div>
            </div>
          </div>
        </div>`;
    }

    function render() {
      const board = document.getElementById('board');
      const groups = {
        R: CARD_POOL.filter((card) => card.rarity === 'R'),
        SR: CARD_POOL.filter((card) => card.rarity === 'SR'),
        SSR: CARD_POOL.filter((card) => card.rarity === 'SSR')
      };

      document.getElementById('allCount').textContent = CARD_POOL.length;
      document.getElementById('rCount').textContent = groups.R.length;
      document.getElementById('srCount').textContent = groups.SR.length;
      document.getElementById('ssrCount').textContent = groups.SSR.length;

      board.innerHTML = ['R', 'SR', 'SSR'].map((rarity) => `
        <section class="group">
          <div class="group-head">
            <h2><span class="rarity-pill ${rarityClass(rarity)}">${rarity}</span>${rarity} 卡正面预览</h2>
            <div class="group-meta">共 ${groups[rarity].length} 张</div>
          </div>
          <div class="card-grid">
            ${groups[rarity].map((card) => `
              <div class="catalog-tile">
                ${buildCardTile(card)}
                <div class="note">
                  <div class="name">${card.name} · ${card.rarity}</div>
                  <div class="desc">${card.description}<br>主题：${card.accent} · 能力：${card.skill}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `).join('');
    }

    render();
  </script>
